<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Barkly Access — Simplified Chat</title>
<style>
:root{color-scheme:dark;--bg:#090909;--panel:#101010;--panel2:#111111;--text:#f1f1f1;--muted:#b8b8b8;--accent:#ff4fa3;--accent-soft:#ff8bc5;--line:#292929;--focus:#ff8bc5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,sans-serif}
.app{max-width:900px;margin:24px auto;padding:16px}.chat{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 12px 40px #0003}
.header{padding:18px 22px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line)}h1{font-size:1.15rem;margin:0}h1::first-letter{color:var(--accent)}.sub{color:var(--muted);font-size:.9rem}.messages{padding:20px;display:grid;gap:20px}.msg{display:grid;grid-template-columns:44px 1fr;gap:12px}.avatar{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-weight:700;background:#292929}.msg:nth-child(2) .avatar{background:#292929}.msg:nth-child(3) .avatar{background:#292929}.name{font-weight:700;color:var(--accent-soft)}.time{font-size:.82rem;color:var(--muted);margin-left:8px}.content{margin-top:3px}.composer{padding:16px 20px;border-top:1px solid var(--line)}textarea{width:100%;resize:vertical;min-height:66px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;color:var(--text);font:inherit}textarea:focus,button:focus{outline:3px solid var(--focus);outline-offset:2px}.actions{display:flex;justify-content:space-between;align-items:center;margin-top:10px;color:var(--muted)}button{background:var(--accent);border:0;color:#090909;font:inherit;font-weight:700;border-radius:10px;padding:9px 16px;cursor:pointer}.quiet{background:transparent;color:var(--text);border:1px solid var(--line)}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 14px}.hint{color:var(--muted);font-size:.9rem;margin:14px 2px}.hidden{display:none}.status{min-height:1.5em;color:var(--accent-soft);margin-top:8px}
@media(max-width:600px){.app{margin:0;padding:8px}.header{padding:15px}.messages{padding:15px}.msg{grid-template-columns:36px 1fr;gap:10px}.avatar{width:36px;height:36px;border-radius:11px}}
</style></head><body><main class="app"><div class="toolbar"><button class="quiet" id="toggleDetails" aria-expanded="true">Hide channel details</button><button class="quiet" id="textSize">Increase text size</button></div><section class="chat" aria-label="Chat prototype"><header class="header"><div><h1 id="channel"># general</h1><div class="sub" id="details">Friendly conversation · Community chat</div></div><button class="quiet" aria-label="More channel options">•••</button></header><section class="messages" aria-label="Messages"><article class="msg"><div class="avatar" aria-hidden="true">A</div><div><div><span class="name">Alex</span><span class="time">10:42 AM</span></div><div class="content">Anyone playing tonight?</div></div></article><article class="msg"><div class="avatar" aria-hidden="true">J</div><div><div><span class="name">Jamie</span><span class="time">10:44 AM</span></div><div class="content">I'm down! Maybe around 7?</div></div></article><article class="msg"><div class="avatar" aria-hidden="true">M</div><div><div><span class="name">Morgan</span><span class="time">10:45 AM</span></div><div class="content">I'll bring snacks lol</div></div></article></section><form class="composer" id="reply"><label for="message"><strong>Reply</strong></label><textarea id="message" placeholder="Write a message…" aria-label="Write a message"></textarea><div class="actions"><span>＋ Attach</span><button type="submit">Send</button></div><div class="status" role="status" aria-live="polite" id="status"></div></form></section><p class="hint">Prototype only — sample messages, no Discord connection. Designed to test spacing, clarity and fewer distractions.</p></main><script>
const details=document.querySelector('#details'),toggle=document.querySelector('#toggleDetails');toggle.addEventListener('click',()=>{details.classList.toggle('hidden');let hidden=details.classList.contains('hidden');toggle.textContent=hidden?'Show channel details':'Hide channel details';toggle.setAttribute('aria-expanded',String(!hidden))});let large=false;document.querySelector('#textSize').addEventListener('click',e=>{large=!large;document.body.style.fontSize=large?'19px':'16px';e.target.textContent=large?'Reset text size':'Increase text size'});document.querySelector('#reply').addEventListener('submit',e=>{e.preventDefault();let val=document.querySelector('#message').value.trim();if(!val)return;document.querySelector('#status').textContent='Sample only: message composer is not connected.';document.querySelector('#message').value=''});
</script></body></html>
